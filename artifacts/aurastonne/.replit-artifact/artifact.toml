kind = "web"
previewPath = "/"
title = "Aurastonne Infra Projects"
version = "1.0.0"
id = "artifacts/aurastonne"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22168

[services.development]
run = "pnpm --filter @workspace/aurastonne run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aurastonne", "run", "build" ]
publicDir = "artifacts/aurastonne/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22168"
BASE_PATH = "/"
